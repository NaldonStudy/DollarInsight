# 로컬 개발 환경 설정
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dinsight
    username: dinsight
    password: secret

  data:
    mongodb:
      host: localhost
      port: 27017
      database: dinsight
      username: root
      password: secret
      authentication-database: admin
    redis:
      host: localhost
      port: 6379
      password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    root: INFO
    com.ssafy.b205: DEBUG
