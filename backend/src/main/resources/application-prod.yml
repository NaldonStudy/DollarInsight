# 프로덕션 환경 설정 (Docker 환경)
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

# 프로덕션에서는 상세 정보를 공개하지 않음
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ssafy.b205: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
