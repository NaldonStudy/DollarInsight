spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dinsight
    username: dinsight
    password: secret

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    baseline-on-migrate: true

  data:
    mongodb:
      uri: mongodb://dinsight:secret@localhost:27017/dinsight?authSource=admin
    redis:
      host: localhost
      port: 6379
      # password: yourPassword   # 쓰면 여기에
      timeout: 2s                # 연결/응답 타임아웃
      client-type: lettuce       # 기본값이지만 명시해도 OK
      # ssl.enabled: true        # TLS 쓰면 켜기

  cache:
    type: redis
    redis:
      time-to-live: 5m
