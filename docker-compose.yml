version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dollar-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dollar_insight}
      POSTGRES_USER: ${POSTGRES_USER:-dopamine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b205dollarinsight}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init-scripts/postgres:/docker-entrypoint-initdb.d  # 초기화 스크립트 있으면 활성화
    ports:
      - "5432:5432"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dopamine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Message Broker)
  redis:
    image: redis:7-alpine
    container_name: dollar-insight-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-b205dollarinsight}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MongoDB (Document Database for News)
  mongodb:
    image: mongo:7
    container_name: dollar-insight-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-b205dollarinsight}
      MONGO_INITDB_DATABASE: dollar_insight
    volumes:
      - mongodb_data:/data/db
      # - ./init-scripts/mongodb:/docker-entrypoint-initdb.d  # 초기화 스크립트 있으면 활성화
    ports:
      - "27017:27017"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB (Vector Database for RAG)
  chromadb:
    image: chromadb/chroma:latest
    container_name: dollar-insight-chromadb
    restart: unless-stopped
    command: run --host 0.0.0.0 --port 9000 --path /data
    environment:
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chromadb_data:/data
    ports:
      - "9000:9000"
    networks:
      - dollar-insight-network

  # Jenkins (CI/CD Server)
  # jenkins:
  #   image: jenkins/jenkins:lts
  #   container_name: dollar-insight-jenkins
  #   restart: unless-stopped
  #   user: root
  #   environment:
  #     - JENKINS_OPTS=--prefix=/jenkins
  #     - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
  #   volumes:
  #     - jenkins_data:/var/jenkins_home
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   ports:
  #     - "8080:8080"
  #     - "50000:50000"
  #   networks:
  #     - dollar-insight-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 90s


  # Backend Service (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dollar-insight-backend:latest
    container_name: dollar-insight-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"  # 호스트:컨테이너 (Jenkins와 포트 충돌 방지)
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AI Service (Python/FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: dollar-insight-ai-service:latest
    container_name: dollar-insight-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"  # FastAPI 기본 포트
      # - "50052:50051"  # gRPC 포트 (필요시 활성화)
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx (리버스 프록시)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: dollar-insight-nginx:latest
    container_name: dollar-insight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # HTTPS 나중에 활성화

    networks:
      - dollar-insight-network
    depends_on:
      - backend
      - ai-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

networks:
  dollar-insight-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  chromadb_data:
    driver: local
  # jenkins_data:
  #   driver: local
  backend_logs:
    driver: local
  ai_service_logs:
    driver: local
  ai_service_models:
    driver: local

