version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dollar-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dollar_insight
      POSTGRES_USER: ${POSTGRES_USER:-dollaruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dollaruser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Message Broker)
  redis:
    image: redis:7-alpine
    container_name: dollar-insight-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MongoDB (Document Database for News)
  mongodb:
    image: mongo:7
    container_name: dollar-insight-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: dollar_insight
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts/mongodb:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB (Vector Database for RAG)
  chromadb:
    image: chromadb/chroma:latest
    container_name: dollar-insight-chromadb
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8001
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8001"
    networks:
      - dollar-insight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Spring Boot Backend
  backend:
    image: ${DOCKER_HUB_REPO:-your-dockerhub-username}/dollar-insight-backend:latest
    container_name: dollar-insight-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dollar_insight
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dollaruser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      
      # MongoDB
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: dollar_insight
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_USER:-admin}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_PASSWORD:-changeme}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      
      # gRPC Client (FastAPI)
      GRPC_CLIENT_AI_SERVICE_HOST: ai-service
      GRPC_CLIENT_AI_SERVICE_PORT: 50051
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRATION: 86400000
      
      # Application
      SERVER_PORT: 8080
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_DOLLARINSIGHT: DEBUG
    ports:
      - "8080:8080"
    networks:
      - dollar-insight-network
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # FastAPI AI Service
  ai-service:
    image: ${DOCKER_HUB_REPO:-your-dockerhub-username}/dollar-insight-ai:latest
    container_name: dollar-insight-ai
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # Service Config
      SERVICE_ENV: production
      LOG_LEVEL: INFO
      
      # LLM API Keys (보안을 위해 .env 파일에서 관리)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # LLM Configuration
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-pro}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      
      # Database Connections
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8001
      
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGO_USER:-admin}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGODB_DATABASE: dollar_insight
      MONGODB_AUTH_SOURCE: admin
      
      # gRPC Server Config
      GRPC_SERVER_PORT: 50051
      GRPC_MAX_WORKERS: 10
      
      # RAG Config
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 50
      RAG_TOP_K: 5
      
      # AI Agents Config
      AI_AGENTS_COUNT: 6
      MAX_CONVERSATION_TURNS: 20
      CONVERSATION_TIMEOUT: 300
      
    ports:
      - "8000:8000"
      - "50051:50051"
    networks:
      - dollar-insight-network
    volumes:
      - ai_logs:/app/logs
      - ai_models:/app/models
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Workers (News Processing)
  celery-worker:
    image: ${DOCKER_HUB_REPO:-your-dockerhub-username}/dollar-insight-ai:latest
    container_name: dollar-insight-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=3
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      # Same as ai-service but optimized for worker
      SERVICE_ENV: production
      LOG_LEVEL: INFO
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8001
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGO_USER:-admin}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGODB_DATABASE: dollar_insight
      MONGODB_AUTH_SOURCE: admin
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - dollar-insight-network
    volumes:
      - ai_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Celery Beat (Scheduler)
  celery-beat:
    image: ${DOCKER_HUB_REPO:-your-dockerhub-username}/dollar-insight-ai:latest
    container_name: dollar-insight-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVICE_ENV: production
      LOG_LEVEL: INFO
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    networks:
      - dollar-insight-network
    volumes:
      - celery_beat_data:/app/celerybeat-schedule

  # Nginx Reverse Proxy
  nginx:
    image: ${DOCKER_HUB_REPO:-your-dockerhub-username}/dollar-insight-nginx:latest
    container_name: dollar-insight-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service
    ports:
      - "80:80"
      - "443:443"
    networks:
      - dollar-insight-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dollar-insight-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  chromadb_data:
    driver: local
  backend_logs:
    driver: local
  ai_logs:
    driver: local
  ai_models:
    driver: local
  celery_beat_data:
    driver: local
  nginx_logs:
    driver: local

